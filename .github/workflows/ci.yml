name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: ruff check src/maintenance test/test_maintenance.py
      - run: pytest -q
      - run: python -m src.maintenance.evaluate_system
      - run: docker compose config --quiet
